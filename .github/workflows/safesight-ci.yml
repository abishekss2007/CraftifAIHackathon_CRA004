name: SafeSight CI

on:
  push:
    paths: ["SafeSight/**", ".github/workflows/safesight-ci.yml"]
  pull_request:
    paths: ["SafeSight/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SafeSight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and scenario tests
        run: python -m unittest -v
      - name: Server smoke test
        run: |
          python -m safesight --source sim --port 8080 --log /tmp/events.jsonl &
          sleep 8
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/api/integrity
          python -m safesight.verify /tmp/events.jsonl
